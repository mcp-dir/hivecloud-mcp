# Smithery configuration for HiveCloud CT-e / MDF-e
# Schema: https://smithery.ai/docs/build/project-config
# Remote HTTP MCP — server hosted at https://api.mcp.ai/p_hivecloud

name: hivecloud-mcp
displayName: "HiveCloud CT-e / MDF-e"
description: >
  Emissor de documentos fiscais de transporte da Bsoft by nstech (HiveCloud). Consulta de CT-e (Conhecimento de Transporte), MDF-e (Manifesto de Documentos Fiscais), DC-e, inutilizações, status da SEFAZ, além de veículos e motoristas. Conecte com o usuário e a senha do seu emissor e o ambiente. Somente leitura nesta versão.

version: 0.1.0
license: MIT
homepage: https://github.com/mcp-dir/hivecloud-mcp
repository: https://github.com/mcp-dir/hivecloud-mcp

tags:
  - hivecloud
  - brazil
  - logistics
  - vertical
  - read-write

# Remote HTTP MCP — sem startCommand local (servidor já hospedado)
startCommand:
  type: http
  url: https://api.mcp.ai/p_hivecloud

auth:
  type: oauth2
  resourceMetadataUrl: https://api.mcp.ai/p_hivecloud/.well-known/oauth-protected-resource
  fallback:
    type: agent-auth
    description: >
      Para clientes sem OAuth 2.1. O agente expõe uma tool authenticate(token).
      Usuário gera o JWT em https://app.mcp.ai/agent-auth e cola no chat.
